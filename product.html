<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product | ChillScenes3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="announce">🚚 Free delivery on all orders above ₹2000</div>

<header>
  <nav>
    <a href="index.html" class="logo"><img src="images/logo.png" alt="ChillScenes3D logo">ChillScenes<span>3D</span></a>
    <ul class="menu">
      <li><a href="index.html">Home</a></li>
      <li><a href="shop.html">Shop</a></li>
      <li><a href="index.html#contact" class="menu-custom">Custom Idea</a></li>
    </ul>
    <div class="nav-search">
      <input type="text" class="nav-search-input" placeholder="Search products or categories..." autocomplete="off">
      <div class="search-dropdown"></div>
    </div>
    <div class="nav-actions">
      <button class="icon-btn" id="cartToggle" aria-label="Cart">
        <i class="fa-solid fa-bag-shopping"></i>
        <span class="cart-count">0</span>
      </button>
      <button class="menuBtn" id="menuBtn"><i class="fa-solid fa-bars"></i></button>
    </div>
  </nav>
</header>

<div class="menuOverlay" id="menuOverlay"></div>
<div class="mobileMenu" id="mobileMenu">
  <div class="nav-search mobile-search">
    <input type="text" class="nav-search-input" placeholder="Search products or categories..." autocomplete="off">
    <div class="search-dropdown"></div>
  </div>
  <a href="index.html">Home</a>
  <a href="shop.html">Shop</a>
  <a href="index.html#contact">Custom Idea</a>
</div>

<section class="section" style="padding-top:60px;">
  <div class="container">
    <div class="pdp" id="pdpWrap"></div>

    <div class="related">
      <div class="section-head reveal in">
        <div><h2>You may also like</h2></div>
      </div>
      <div class="product-grid" id="relatedGrid"></div>
    </div>
  </div>
</section>

<footer>
  <div class="container">
    <div class="footer-bottom">
      <p>© 2026 ChillScenes3D. All rights reserved.</p>
      <p><a href="https://wa.me/919810704170" target="_blank">WhatsApp: +91 98107 04170</a></p>
    </div>
  </div>
</footer>

<div class="cart-overlay" id="cartOverlay"></div>
<aside class="cart-drawer" id="cartDrawer">
  <div class="cart-head">
    <h3>Your Cart</h3>
    <div style="display:flex; align-items:center; gap:16px;">
      <button id="clearCartBtn" class="cart-clear" title="Clear cart">Clear</button>
      <button id="cartClose"><i class="fa-solid fa-xmark"></i></button>
    </div>
  </div>
  <div class="cart-body" id="cartBody"></div>
  <div class="cart-footer" id="cartFooter">
    <div class="compact-fields">
      <input type="text" id="nameInput" placeholder="Name">
      <input type="tel" id="phoneInput" placeholder="Phone number" inputmode="tel">
      <input type="text" id="pincodeInput" placeholder="Delivery pincode" inputmode="numeric" maxlength="6">
    </div>
    <div class="coupon-row">
      <input type="text" id="couponInput" placeholder="Coupon code">
      <button type="button" class="btn btn-outline btn-sm" id="applyCouponBtn">Apply</button>
    </div>
    <div class="coupon-status" id="couponStatus"></div>
    <div class="cart-total-row sub"><span>Subtotal</span><span id="cartSubtotal">₹0</span></div>
    <div class="cart-total-row discount" id="discountRow" style="display:none;"><span>Discount</span><span id="cartDiscount">-₹0</span></div>
    <div class="cart-total-row grand"><span>Total</span><span id="cartTotal">₹0</span></div>
    <button class="btn btn-block" id="checkoutBtn">Checkout</button>
  </div>
</aside>

<script src="js/config.js"></script>
<script src="js/products.js"></script>
<script src="js/cart.js"></script>
<script src="js/main.js"></script>
</body>
</html>
